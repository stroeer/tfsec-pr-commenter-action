version: 2
updates:
  # GitHub Actions ecosystem
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 8
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  # Go modules ecosystem
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 8
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns:
          - "*"
